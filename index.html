<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >
    <meta name="theme-color" content="#090909">
    <title>Weather Mini App</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            color-scheme: dark;

            --bg: #090909;
            --panel: #121212;
            --panel-2: #181818;
            --panel-3: #202020;

            --text: #f4f4f4;
            --muted: #989898;
            --faint: #656565;

            --line: #2a2a2a;
            --line-strong: #414141;

            --white: #ffffff;
            --black: #000000;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            overflow-x: hidden;
            background: var(--bg);
        }

        body {
            color: var(--text);
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        button {
            font: inherit;
        }

        img {
            display: block;
            max-width: 100%;
        }

        .hidden {
            display: none !important;
        }

        .app {
            width: 100%;
            max-width: 720px;
            margin: 0 auto;
            padding:
                calc(12px + env(safe-area-inset-top))
                12px
                calc(30px + env(safe-area-inset-bottom));
        }

        .greeting {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            max-width: 100%;
            animation: enter-down 0.55s cubic-bezier(.2, .8, .2, 1) both;
        }

        .avatar {
            display: grid;
            place-items: center;
            width: 44px;
            min-width: 44px;
            height: 44px;
            overflow: hidden;
            border: 1px solid var(--line-strong);
            border-radius: 50%;
            color: var(--black);
            background: var(--white);
            font-size: 14px;
            font-weight: 750;
            animation: avatar-breathe 3.2s ease-in-out infinite;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .greeting-text {
            min-width: 0;
            margin: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 16px;
            font-weight: 650;
            letter-spacing: -0.02em;
        }

        .title-row {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 12px;
            margin: 24px 2px 12px;
            animation: enter-up 0.58s 0.06s cubic-bezier(.2, .8, .2, 1) both;
        }

        .city-title {
            min-width: 0;
            margin: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: clamp(30px, 10vw, 46px);
            font-weight: 560;
            letter-spacing: -0.055em;
            line-height: 1;
        }

        .updated {
            flex: 0 0 auto;
            margin: 0 0 2px;
            color: var(--muted);
            font-size: 11px;
            text-align: right;
            white-space: nowrap;
        }

        .panel {
            width: 100%;
            min-width: 0;
            margin-top: 10px;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 20px;
            background: var(--panel);
        }

        .loading,
        .error {
            padding: 18px;
        }

        .loading {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .spinner {
            width: 20px;
            min-width: 20px;
            height: 20px;
            border: 2px solid var(--line-strong);
            border-top-color: var(--white);
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
        }

        .error-title {
            margin: 0 0 8px;
            font-size: 17px;
        }

        .error-text {
            margin: 0;
            color: var(--muted);
            line-height: 1.55;
        }

        .retry {
            width: 100%;
            margin-top: 15px;
            padding: 13px 16px;
            border: 0;
            border-radius: 13px;
            color: var(--black);
            background: var(--white);
            font-weight: 700;
            cursor: pointer;
        }

        .hero {
            position: relative;
            min-height: 248px;
            padding: 18px;
            background:
                radial-gradient(
                    circle at 90% 10%,
                    rgba(255, 255, 255, 0.06),
                    transparent 38%
                ),
                var(--panel);
            animation: enter-up 0.58s 0.08s cubic-bezier(.2, .8, .2, 1) both;
        }

        .location {
            display: flex;
            align-items: center;
            gap: 7px;
            min-width: 0;
            color: var(--muted);
            font-size: 12px;
        }

        .location-dot {
            width: 6px;
            min-width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--white);
        }

        .location-name {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .hero-main {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 88px;
            align-items: center;
            gap: 8px;
            margin-top: 28px;
        }

        .temperature {
            margin: 0;
            font-size: clamp(76px, 26vw, 116px);
            font-weight: 420;
            letter-spacing: -0.09em;
            line-height: 0.82;
            animation: temp-enter 0.8s 0.12s cubic-bezier(.15, .85, .2, 1) both;
        }

        .weather-art {
            display: grid;
            place-items: center;
            width: 88px;
            height: 88px;
            justify-self: end;
            border: 1px solid var(--line);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.02);
            animation: float 3.4s ease-in-out infinite;
        }

        .weather-art img {
            width: 92px;
            height: 92px;
            object-fit: contain;
            filter: grayscale(1) contrast(1.18);
            transform: scale(1.08);
        }

        .condition {
            margin: 24px 0 0;
            font-size: 20px;
            font-weight: 560;
            letter-spacing: -0.02em;
        }

        .feels {
            margin: 6px 0 0;
            color: var(--muted);
            font-size: 13px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 1px;
            background: var(--line);
            animation: enter-up 0.58s 0.13s cubic-bezier(.2, .8, .2, 1) both;
        }

        .stat {
            min-width: 0;
            min-height: 92px;
            padding: 13px;
            background: var(--panel);
        }

        .stat-label {
            display: block;
            margin-bottom: 9px;
            color: var(--muted);
            font-size: 10px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .stat-value {
            display: block;
            overflow-wrap: anywhere;
            font-size: 19px;
            font-weight: 600;
            letter-spacing: -0.025em;
        }

        .stat-detail {
            display: block;
            margin-top: 5px;
            color: var(--faint);
            font-size: 10px;
        }

        .section {
            padding: 16px;
        }

        .section-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 14px;
        }

        .section-title {
            margin: 0;
            font-size: 17px;
            font-weight: 620;
            letter-spacing: -0.02em;
        }

        .section-note {
            margin: 0;
            color: var(--muted);
            font-size: 10px;
            text-align: right;
        }

        .hour-grid {
            display: flex;
            width: 100%;
            max-width: 100%;
            gap: 9px;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 2px 2px 8px;
            scroll-snap-type: x mandatory;
            scroll-padding-inline: 2px;
            overscroll-behavior-inline: contain;
            touch-action: pan-x;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .hour-grid::-webkit-scrollbar {
            display: none;
        }

        .hour {
            flex: 0 0 94px;
            min-width: 0;
            padding: 12px 8px;
            border: 1px solid var(--line);
            border-radius: 15px;
            background: var(--panel-2);
            text-align: center;
            scroll-snap-align: start;
            scroll-snap-stop: always;
        }

        .hour-day {
            min-height: 14px;
            margin: 0 0 3px;
            color: var(--faint);
            font-size: 9px;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .hour-time {
            margin: 0;
            color: var(--muted);
            font-size: 11px;
        }

        .hour-icon {
            display: grid;
            place-items: center;
            height: 48px;
            margin: 7px 0 4px;
        }

        .hour-icon img {
            width: 50px;
            height: 50px;
            object-fit: contain;
            filter: grayscale(1) contrast(1.16);
        }

        .hour-temp {
            margin: 0;
            font-size: 19px;
            font-weight: 650;
        }

        .hour-rain {
            min-height: 26px;
            margin: 7px 0 0;
            color: var(--muted);
            font-size: 10px;
            line-height: 1.3;
        }

        .forecast {
            display: grid;
            gap: 1px;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 15px;
            background: var(--line);
        }

        .forecast-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 42px auto;
            align-items: center;
            gap: 9px;
            min-width: 0;
            min-height: 68px;
            padding: 10px 12px;
            background: var(--panel-2);
        }

        .forecast-info {
            min-width: 0;
        }

        .forecast-day {
            margin: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 14px;
            font-weight: 600;
        }

        .forecast-description {
            display: block;
            margin-top: 4px;
            overflow: hidden;
            color: var(--muted);
            font-size: 10px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .forecast-icon {
            display: grid;
            place-items: center;
        }

        .forecast-icon img {
            width: 44px;
            height: 44px;
            object-fit: contain;
            filter: grayscale(1) contrast(1.16);
        }

        .forecast-values {
            min-width: 82px;
            text-align: right;
            white-space: nowrap;
        }

        .forecast-temp {
            display: block;
            font-size: 14px;
            font-weight: 650;
        }

        .forecast-rain {
            display: block;
            margin-top: 5px;
            color: var(--muted);
            font-size: 10px;
        }

        .sun-card {
            position: relative;
            min-height: 286px;
            padding: 17px 17px 15px;
            overflow: hidden;
            background:
                radial-gradient(
                    circle at 50% 34%,
                    rgba(255, 255, 255, 0.095),
                    transparent 31%
                ),
                linear-gradient(
                    180deg,
                    #252525 0%,
                    #171717 58%,
                    #111111 100%
                );
        }

        .sun-card::after {
            position: absolute;
            inset: 0;
            pointer-events: none;
            border-radius: inherit;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.035);
            content: "";
        }

        .sun-card-head {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .sun-card-label {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            min-width: 0;
            color: #b6b6b6;
            font-size: 12px;
            font-weight: 650;
            letter-spacing: 0.075em;
            text-transform: uppercase;
        }

        .sun-card-label svg {
            width: 18px;
            min-width: 18px;
            height: 18px;
            opacity: 0.78;
        }

        .sun-duration {
            flex: 0 0 auto;
            color: var(--muted);
            font-size: 10px;
            white-space: nowrap;
        }

        .sun-event-time {
            position: relative;
            z-index: 2;
            margin-top: 13px;
            font-size: clamp(48px, 15vw, 68px);
            font-weight: 430;
            letter-spacing: -0.065em;
            line-height: 0.96;
        }

        .sun-curve {
            position: relative;
            z-index: 1;
            width: calc(100% + 34px);
            margin: -2px -17px -3px;
        }

        .sun-curve svg {
            display: block;
            width: 100%;
            height: 128px;
            overflow: visible;
        }

        .sun-path-shadow {
            fill: none;
            stroke: rgba(0, 0, 0, 0.28);
            stroke-width: 8;
        }

        .sun-path {
            fill: none;
            stroke: url(#sunPathGradient);
            stroke-linecap: round;
            stroke-width: 5;
        }

        .sun-horizon {
            stroke: rgba(255, 255, 255, 0.46);
            stroke-width: 1.4;
        }

        .sun-position-glow {
            fill: rgba(255, 255, 255, 0.22);
            filter: blur(5px);
        }

        .sun-position {
            fill: #ffffff;
            stroke: rgba(255, 255, 255, 0.45);
            stroke-width: 4;
            transition:
                cx 0.7s cubic-bezier(.2, .8, .2, 1),
                cy 0.7s cubic-bezier(.2, .8, .2, 1),
                opacity 0.3s ease;
        }

        .sun-card-footer {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: baseline;
            gap: 6px;
            margin-top: -1px;
            font-size: 15px;
        }

        .sun-secondary-label {
            color: var(--text);
        }

        .sun-secondary-time {
            font-size: 24px;
            font-weight: 560;
            letter-spacing: -0.035em;
        }

        .aqi {
            display: grid;
            grid-template-columns: 112px minmax(0, 1fr);
            gap: 10px;
        }

        .aqi-main {
            display: grid;
            align-content: center;
            min-height: 134px;
            padding: 15px;
            border: 1px solid var(--line);
            border-radius: 15px;
            background: var(--panel-2);
        }

        .aqi-value {
            margin: 0;
            font-size: 54px;
            font-weight: 420;
            letter-spacing: -0.07em;
            line-height: 1;
        }

        .aqi-status {
            margin: 8px 0 0;
            color: var(--muted);
            font-size: 11px;
        }

        .pollutants {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 7px;
        }

        .pollutant {
            min-width: 0;
            padding: 10px;
            border: 1px solid var(--line);
            border-radius: 13px;
            background: var(--panel-2);
        }

        .pollutant-name {
            display: block;
            color: var(--muted);
            font-size: 9px;
        }

        .pollutant-value {
            display: block;
            margin-top: 6px;
            overflow-wrap: anywhere;
            font-family:
                ui-monospace,
                SFMono-Regular,
                Menlo,
                monospace;
            font-size: 12px;
        }

        .footer {
            padding: 22px 6px 0;
            color: var(--faint);
            font-size: 10px;
            line-height: 1.5;
            text-align: center;
        }

        #weather-content > * {
            animation: enter-up 0.58s cubic-bezier(.2, .8, .2, 1) both;
        }

        #weather-content > *:nth-child(2) {
            animation-delay: 0.05s;
        }

        #weather-content > *:nth-child(3) {
            animation-delay: 0.10s;
        }

        #weather-content > *:nth-child(4) {
            animation-delay: 0.15s;
        }

        #weather-content > *:nth-child(5) {
            animation-delay: 0.20s;
        }

        .hour,
        .forecast-row,
        .sun,
        .pollutant,
        .retry {
            transition:
                transform 0.18s ease,
                border-color 0.18s ease,
                background-color 0.18s ease;
        }

        .hour:active,
        .forecast-row:active,
        .sun:active,
        .pollutant:active,
        .retry:active {
            transform: scale(0.98);
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes enter-down {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes enter-up {
            from {
                opacity: 0;
                transform: translateY(14px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes temp-enter {
            from {
                opacity: 0;
                transform: translateY(10px) scale(0.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-5px);
            }
        }

        @keyframes avatar-breathe {
            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(255, 255, 255, 0);
            }

            50% {
                box-shadow: 0 0 0 5px rgba(255, 255, 255, 0.045);
            }
        }

        @media (hover: hover) {
            .hour:hover,
            .forecast-row:hover,
            .sun:hover,
            .pollutant:hover {
                transform: translateY(-2px);
                border-color: var(--line-strong);
                background: var(--panel-3);
            }
        }

        @media (max-width: 360px) {
            .app {
                padding-inline: 9px;
            }

            .title-row {
                align-items: flex-start;
                flex-direction: column;
                gap: 6px;
            }

            .updated {
                text-align: left;
            }

            .hero-main {
                grid-template-columns: minmax(0, 1fr) 74px;
            }

            .weather-art {
                width: 74px;
                height: 74px;
            }

            .weather-art img {
                width: 78px;
                height: 78px;
            }

            .stat-value {
                font-size: 17px;
            }

            .hour {
                flex-basis: 90px;
            }

            .forecast-row {
                grid-template-columns: minmax(0, 1fr) 38px;
            }

            .forecast-values {
                grid-column: 1 / -1;
                min-width: 0;
                text-align: left;
            }

            .forecast-temp,
            .forecast-rain {
                display: inline;
            }

            .forecast-rain {
                margin-left: 8px;
            }

            .aqi {
                grid-template-columns: 1fr;
            }

            .aqi-main {
                min-height: 110px;
            }
        }

        @media (max-width: 320px) {
            .stats {
                grid-template-columns: 1fr;
            }


            .pollutants {
                grid-template-columns: 1fr;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>
    <main class="app">
        <section class="greeting" aria-label="Пользователь Telegram">
            <div id="avatar" class="avatar">TG</div>
            <p id="greeting-text" class="greeting-text">Привет!</p>
        </section>

        <header class="title-row">
            <h1 id="page-title" class="city-title">Погода</h1>
            <p id="updated" class="updated"></p>
        </header>

        <section id="loading-card" class="panel loading">
            <div class="spinner"></div>
            <span>Получаем погодные данные…</span>
        </section>

        <section id="error-card" class="panel error hidden">
            <h2 class="error-title">Ошибка загрузки</h2>
            <p id="error-text" class="error-text"></p>

            <button id="retry-button" class="retry" type="button">
                Повторить
            </button>
        </section>

        <div id="weather-content" class="hidden">
            <section class="panel hero">
                <div class="location">
                    <span class="location-dot"></span>
                    <span id="location-name" class="location-name"></span>
                </div>

                <div class="hero-main">
                    <p id="current-temperature" class="temperature">—</p>
                    <div id="current-icon" class="weather-art">—</div>
                </div>

                <p id="current-condition" class="condition"></p>
                <p id="current-feels" class="feels"></p>
            </section>

            <section id="metrics" class="panel stats"></section>

            <section class="panel section">
                <div class="section-head">
                    <h2 class="section-title">Сегодня по часам</h2>
                    <p class="section-note">шаг 3 часа · листай →</p>
                </div>

                <div id="hourly-list" class="hour-grid"></div>
            </section>

            <section class="panel section">
                <div class="section-head">
                    <h2 class="section-title">Пять дней</h2>
                    <p class="section-note">температура и осадки</p>
                </div>

                <div id="daily-list" class="forecast"></div>
            </section>

            <section class="panel sun-card" aria-label="Световой день">
                <div class="sun-card-head">
                    <div class="sun-card-label">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path
                                d="M4 17h16M7 13a5 5 0 0 1 10 0M12 2v3M4.9 5.9 7 8M19.1 5.9 17 8M2 12h3M19 12h3"
                                fill="none"
                                stroke="currentColor"
                                stroke-linecap="round"
                                stroke-width="1.8"
                            />
                        </svg>
                        <span id="sun-event-label">Заход солнца</span>
                    </div>

                    <span id="daylight-duration" class="sun-duration"></span>
                </div>

                <div id="sun-event-time" class="sun-event-time">—</div>

                <div class="sun-curve" aria-hidden="true">
                    <svg viewBox="0 0 360 130" preserveAspectRatio="none">
                        <defs>
                            <linearGradient
                                id="sunPathGradient"
                                x1="0"
                                y1="0"
                                x2="1"
                                y2="0"
                            >
                                <stop offset="0%" stop-color="#555555" />
                                <stop offset="50%" stop-color="#e9e9e9" />
                                <stop offset="100%" stop-color="#4a4a4a" />
                            </linearGradient>
                        </defs>

                        <path
                            class="sun-path-shadow"
                            d="M 0 104 Q 180 -34 360 104"
                        />
                        <path
                            class="sun-path"
                            d="M 0 104 Q 180 -34 360 104"
                        />
                        <line
                            class="sun-horizon"
                            x1="0"
                            y1="84"
                            x2="360"
                            y2="84"
                        />
                        <circle
                            id="sun-position-glow"
                            class="sun-position-glow"
                            cx="0"
                            cy="104"
                            r="13"
                        />
                        <circle
                            id="sun-position"
                            class="sun-position"
                            cx="0"
                            cy="104"
                            r="6"
                        />
                    </svg>
                </div>

                <div class="sun-card-footer">
                    <span id="sun-secondary-label" class="sun-secondary-label">
                        Восход:
                    </span>
                    <strong id="sun-secondary-time" class="sun-secondary-time">—</strong>
                </div>
            </section>

            <section class="panel section">
                <div class="section-head">
                    <h2 class="section-title">Качество воздуха</h2>
                    <p class="section-note">μg/m³</p>
                </div>

                <div class="aqi">
                    <div class="aqi-main">
                        <p id="aqi-number" class="aqi-value">—</p>
                        <p id="aqi-status" class="aqi-status"></p>
                    </div>

                    <div id="pollutants" class="pollutants"></div>
                </div>
            </section>

            <footer class="footer">
                Данные предоставлены OpenWeather.
            </footer>
        </div>
    </main>

    <script>
        const telegram = window.Telegram?.WebApp;

        function readParameters() {
            const parameters = new URLSearchParams(
                window.location.search
            );

            return {
                city: parameters.get("city")?.trim() ?? "",
                key: parameters.get("key")?.trim() ?? "",
            };
        }

        const parameters = readParameters();
        const REQUESTED_CITY = parameters.city;
        const OPENWEATHER_API_KEY = parameters.key;

        function clearKeyFromAddress() {
            if (!OPENWEATHER_API_KEY) {
                return;
            }

            const cleanUrl = new URL(window.location.href);
            cleanUrl.searchParams.delete("key");

            window.history.replaceState(
                {},
                document.title,
                cleanUrl.toString()
            );
        }

        clearKeyFromAddress();

        const elements = {
            loading: document.getElementById("loading-card"),
            error: document.getElementById("error-card"),
            errorText: document.getElementById("error-text"),
            retry: document.getElementById("retry-button"),
            content: document.getElementById("weather-content"),

            avatar: document.getElementById("avatar"),
            greetingText: document.getElementById("greeting-text"),

            pageTitle: document.getElementById("page-title"),
            updated: document.getElementById("updated"),

            locationName: document.getElementById("location-name"),
            temperature: document.getElementById("current-temperature"),
            currentIcon: document.getElementById("current-icon"),
            condition: document.getElementById("current-condition"),
            feels: document.getElementById("current-feels"),

            metrics: document.getElementById("metrics"),
            hourly: document.getElementById("hourly-list"),
            daily: document.getElementById("daily-list"),

            sunEventLabel: document.getElementById("sun-event-label"),
            sunEventTime: document.getElementById("sun-event-time"),
            sunSecondaryLabel:
                document.getElementById("sun-secondary-label"),
            sunSecondaryTime:
                document.getElementById("sun-secondary-time"),
            daylightDuration:
                document.getElementById("daylight-duration"),
            sunPosition: document.getElementById("sun-position"),
            sunPositionGlow:
                document.getElementById("sun-position-glow"),

            aqiNumber: document.getElementById("aqi-number"),
            aqiStatus: document.getElementById("aqi-status"),
            pollutants: document.getElementById("pollutants"),
        };

        function initializeTelegram() {
            if (!telegram) {
                renderUser(null);
                return;
            }

            telegram.ready();
            telegram.expand();

            try {
                telegram.setHeaderColor("#090909");
                telegram.setBackgroundColor("#090909");

                if (typeof telegram.setBottomBarColor === "function") {
                    telegram.setBottomBarColor("#090909");
                }
            } catch (error) {
                console.debug(
                    "Не все методы оформления поддерживаются:",
                    error
                );
            }

            renderUser(
                telegram.initDataUnsafe?.user ?? null
            );
        }

        function initials(user) {
            if (!user) {
                return "TG";
            }

            return [
                user.first_name,
                user.last_name,
            ]
                .filter(Boolean)
                .map((value) => value.trim().charAt(0))
                .join("")
                .slice(0, 2)
                .toUpperCase() || "TG";
        }

        function renderUser(user) {
            if (!user) {
                elements.avatar.textContent = "TG";
                elements.greetingText.textContent = "Привет!";
                return;
            }

            const displayName =
                user.username
                    || user.first_name
                    || "друг";

            elements.greetingText.textContent =
                `Привет, ${displayName}`;

            elements.avatar.textContent = initials(user);

            if (user.photo_url) {
                const image = document.createElement("img");

                image.src = user.photo_url;
                image.alt = `Аватар ${displayName}`;
                image.referrerPolicy = "no-referrer";

                image.addEventListener(
                    "error",
                    () => {
                        elements.avatar.textContent = initials(user);
                    },
                    { once: true }
                );

                elements.avatar.replaceChildren(image);
            }
        }

        function apiUrl(path, values) {
            const query = new URLSearchParams({
                ...values,
                appid: OPENWEATHER_API_KEY,
            });

            return `https://api.openweathermap.org${path}?${query}`;
        }

        async function fetchJson(url, message) {
            let response;

            try {
                response = await fetch(url);
            } catch {
                throw new Error(
                    "Не удалось подключиться к погодному сервису."
                );
            }

            let data;

            try {
                data = await response.json();
            } catch {
                throw new Error(message);
            }

            if (!response.ok) {
                const apiMessage =
                    typeof data?.message === "string"
                        ? data.message
                        : "";

                throw new Error(
                    apiMessage
                        ? `${message} ${apiMessage}`
                        : message
                );
            }

            return data;
        }

        async function findCity(city) {
            const query = new URLSearchParams({
                q: city,
                limit: "1",
                appid: OPENWEATHER_API_KEY,
            });

            const result = await fetchJson(
                `https://api.openweathermap.org/geo/1.0/direct?${query}`,
                "Не удалось найти город."
            );

            if (!Array.isArray(result) || result.length === 0) {
                throw new Error(
                    `Город «${city}» не найден. Проверь написание.`
                );
            }

            return result[0];
        }

        async function loadWeather(location) {
            const common = {
                lat: String(location.lat),
                lon: String(location.lon),
                units: "metric",
                lang: "ru",
            };

            const results = await Promise.allSettled([
                fetchJson(
                    apiUrl("/data/2.5/weather", common),
                    "Не удалось получить текущую погоду."
                ),
                fetchJson(
                    apiUrl("/data/2.5/forecast", common),
                    "Не удалось получить прогноз."
                ),
                fetchJson(
                    apiUrl("/data/2.5/air_pollution", {
                        lat: common.lat,
                        lon: common.lon,
                    }),
                    "Не удалось получить качество воздуха."
                ),
            ]);

            if (results[0].status === "rejected") {
                throw results[0].reason;
            }

            if (results[1].status === "rejected") {
                throw results[1].reason;
            }

            return {
                current: results[0].value,
                forecast: results[1].value,
                pollution:
                    results[2].status === "fulfilled"
                        ? results[2].value
                        : null,
            };
        }

        function iconUrl(icon) {
            return icon
                ? `https://openweathermap.org/img/wn/${icon}@2x.png`
                : "";
        }

        function weatherImage(icon, description) {
            const image = document.createElement("img");

            image.src = iconUrl(icon);
            image.alt = description || "Погода";
            image.loading = "lazy";
            image.decoding = "async";

            image.addEventListener(
                "error",
                () => {
                    image.replaceWith(
                        document.createTextNode("◌")
                    );
                },
                { once: true }
            );

            return image;
        }

        function capitalize(value) {
            if (!value) {
                return "";
            }

            return value.charAt(0).toUpperCase() + value.slice(1);
        }

        function direction(degrees = 0) {
            const values = [
                "С",
                "СВ",
                "В",
                "ЮВ",
                "Ю",
                "ЮЗ",
                "З",
                "СЗ",
            ];

            return values[
                Math.round(degrees / 45) % values.length
            ];
        }

        function formatCityDate(
            timestamp,
            timezoneOffset,
            options
        ) {
            return new Intl.DateTimeFormat(
                "ru-RU",
                {
                    ...options,
                    timeZone: "UTC",
                }
            ).format(
                new Date((timestamp + timezoneOffset) * 1000)
            );
        }

        function time(timestamp, timezoneOffset) {
            return formatCityDate(
                timestamp,
                timezoneOffset,
                {
                    hour: "2-digit",
                    minute: "2-digit",
                }
            );
        }

        function dateKey(timestamp, timezoneOffset) {
            return new Date(
                (timestamp + timezoneOffset) * 1000
            )
                .toISOString()
                .slice(0, 10);
        }

        function updatedAt(timestamp, timezoneOffset) {
            return formatCityDate(
                timestamp,
                timezoneOffset,
                {
                    hour: "2-digit",
                    minute: "2-digit",
                }
            );
        }

        function createStat(label, value, detail = "") {
            const stat = document.createElement("div");
            stat.className = "stat";

            const labelElement = document.createElement("span");
            labelElement.className = "stat-label";
            labelElement.textContent = label;

            const valueElement = document.createElement("span");
            valueElement.className = "stat-value";
            valueElement.textContent = value;

            stat.append(labelElement, valueElement);

            if (detail) {
                const detailElement = document.createElement("span");
                detailElement.className = "stat-detail";
                detailElement.textContent = detail;
                stat.append(detailElement);
            }

            return stat;
        }

        function renderCurrent(current, location) {
            const weather = current.weather?.[0] ?? {};

            const locationName = [
                location.name,
                location.state,
                location.country,
            ]
                .filter(Boolean)
                .filter(
                    (value, index, array) =>
                        array.indexOf(value) === index
                )
                .join(", ");

            elements.pageTitle.textContent =
                location.name || REQUESTED_CITY;

            elements.updated.textContent =
                `обновлено ${updatedAt(
                    current.dt,
                    current.timezone
                )}`;

            elements.locationName.textContent = locationName;

            elements.temperature.textContent =
                `${Math.round(current.main.temp)}°`;

            elements.currentIcon.replaceChildren(
                weatherImage(
                    weather.icon,
                    weather.description
                )
            );

            elements.condition.textContent =
                capitalize(weather.description);

            elements.feels.textContent =
                `Ощущается как ${Math.round(
                    current.main.feels_like
                )} °C`;

            const degrees = current.wind?.deg ?? 0;

            elements.metrics.replaceChildren(
                createStat(
                    "Влажность",
                    `${current.main.humidity}%`
                ),
                createStat(
                    "Давление",
                    `${current.main.pressure} hPa`
                ),
                createStat(
                    "Ветер",
                    `${(current.wind?.speed ?? 0).toFixed(1)} м/с`,
                    `${direction(degrees)}, ${degrees}°`
                ),
                createStat(
                    "Порывы",
                    Number.isFinite(current.wind?.gust)
                        ? `${current.wind.gust.toFixed(1)} м/с`
                        : "—"
                ),
                createStat(
                    "Облачность",
                    `${current.clouds?.all ?? 0}%`
                ),
                createStat(
                    "Видимость",
                    Number.isFinite(current.visibility)
                        ? `${(current.visibility / 1000).toFixed(1)} км`
                        : "—"
                ),
                createStat(
                    "Минимум",
                    `${Math.round(current.main.temp_min)}°`
                ),
                createStat(
                    "Максимум",
                    `${Math.round(current.main.temp_max)}°`
                )
            );

            renderSunCard(current);
        }

        function formatDuration(seconds) {
            const totalMinutes = Math.max(
                0,
                Math.round(seconds / 60)
            );

            const hours = Math.floor(totalMinutes / 60);
            const minutes = totalMinutes % 60;

            return `${hours} ч ${minutes} мин`;
        }

        function renderSunCard(current) {
            const sunrise = current.sys.sunrise;
            const sunset = current.sys.sunset;
            const now = current.dt;
            const timezone = current.timezone;

            elements.sunEventLabel.textContent = "Заход солнца";
            elements.sunEventTime.textContent = time(
                sunset,
                timezone
            );
            elements.sunSecondaryLabel.textContent = "Восход:";
            elements.sunSecondaryTime.textContent = time(
                sunrise,
                timezone
            );
            elements.daylightDuration.textContent =
                formatDuration(sunset - sunrise);

            const progress = Math.min(
                1,
                Math.max(
                    0,
                    (now - sunrise) / (sunset - sunrise)
                )
            );

            const x = 360 * progress;
            const y = 104 - 276 * progress * (1 - progress);
            const isDaylight = now >= sunrise && now <= sunset;
            const opacity = isDaylight ? "1" : "0.42";

            for (const point of [
                elements.sunPosition,
                elements.sunPositionGlow,
            ]) {
                point.setAttribute("cx", x.toFixed(2));
                point.setAttribute("cy", y.toFixed(2));
                point.style.opacity = opacity;
            }
        }

        function precipitation(item) {
            return (
                (item.rain?.["3h"] ?? 0)
                + (item.snow?.["3h"] ?? 0)
            );
        }

        function renderHourly(forecast) {
            const timezoneOffset = forecast.city.timezone;
            const now = Math.floor(Date.now() / 1000);

            const upcoming = forecast.list.filter(
                (item) => item.dt >= now - 3600
            );

            const first = upcoming[0] ?? forecast.list[0];

            if (!first) {
                elements.hourly.textContent =
                    "Прогноз недоступен.";
                return;
            }

            const currentDay = dateKey(
                first.dt,
                timezoneOffset
            );

            const items = upcoming.slice(0, 8);

            const cards = items.map((item) => {
                const weather = item.weather?.[0] ?? {};

                const card = document.createElement("article");
                card.className = "hour";

                const dayElement = document.createElement("p");
                dayElement.className = "hour-day";

                const itemDay = dateKey(
                    item.dt,
                    timezoneOffset
                );

                dayElement.textContent =
                    itemDay === currentDay
                        ? "сегодня"
                        : "завтра";

                const timeElement = document.createElement("p");
                timeElement.className = "hour-time";
                timeElement.textContent = time(
                    item.dt,
                    timezoneOffset
                );

                const icon = document.createElement("div");
                icon.className = "hour-icon";
                icon.append(
                    weatherImage(
                        weather.icon,
                        weather.description
                    )
                );

                const temp = document.createElement("p");
                temp.className = "hour-temp";
                temp.textContent =
                    `${Math.round(item.main.temp)}°`;

                const rain = document.createElement("p");
                rain.className = "hour-rain";

                const amount = precipitation(item);
                const chance = Math.round(
                    (item.pop ?? 0) * 100
                );

                rain.textContent =
                    amount > 0
                        ? `${amount.toFixed(1)} мм · ${chance}%`
                        : `${chance}% осадков`;

                card.append(
                    dayElement,
                    timeElement,
                    icon,
                    temp,
                    rain
                );
                return card;
            });

            elements.hourly.replaceChildren(...cards);
        }

        function aggregateDays(forecast) {
            const timezoneOffset = forecast.city.timezone;
            const groups = new Map();

            for (const item of forecast.list) {
                const key = dateKey(
                    item.dt,
                    timezoneOffset
                );

                if (!groups.has(key)) {
                    groups.set(key, []);
                }

                groups.get(key).push(item);
            }

            return Array.from(groups.entries())
                .slice(0, 5)
                .map(([key, items]) => {
                    const temperatures = items.map(
                        (item) => item.main.temp
                    );

                    const representative = items.reduce(
                        (best, item) => {
                            const itemHour = Number(
                                time(
                                    item.dt,
                                    timezoneOffset
                                ).slice(0, 2)
                            );

                            const bestHour = Number(
                                time(
                                    best.dt,
                                    timezoneOffset
                                ).slice(0, 2)
                            );

                            return Math.abs(itemHour - 12)
                                < Math.abs(bestHour - 12)
                                ? item
                                : best;
                        }
                    );

                    return {
                        key,
                        min: Math.min(...temperatures),
                        max: Math.max(...temperatures),
                        chance: Math.max(
                            ...items.map(
                                (item) => item.pop ?? 0
                            )
                        ),
                        amount: items.reduce(
                            (sum, item) =>
                                sum + precipitation(item),
                            0
                        ),
                        representative,
                    };
                });
        }

        function dayName(key, index) {
            if (index === 0) return "Сегодня";
            if (index === 1) return "Завтра";

            return new Intl.DateTimeFormat(
                "ru-RU",
                {
                    weekday: "short",
                    day: "numeric",
                    month: "short",
                    timeZone: "UTC",
                }
            ).format(
                new Date(`${key}T12:00:00Z`)
            );
        }

        function renderForecast(forecast) {
            const rows = aggregateDays(forecast).map(
                (day, index) => {
                    const weather =
                        day.representative.weather?.[0] ?? {};

                    const row = document.createElement("article");
                    row.className = "forecast-row";

                    const info = document.createElement("div");
                    info.className = "forecast-info";

                    const name = document.createElement("p");
                    name.className = "forecast-day";
                    name.textContent = dayName(day.key, index);

                    const description =
                        document.createElement("span");

                    description.className =
                        "forecast-description";

                    description.textContent =
                        capitalize(weather.description);

                    info.append(name, description);

                    const icon = document.createElement("div");
                    icon.className = "forecast-icon";
                    icon.append(
                        weatherImage(
                            weather.icon,
                            weather.description
                        )
                    );

                    const values = document.createElement("div");
                    values.className = "forecast-values";

                    const temp = document.createElement("span");
                    temp.className = "forecast-temp";
                    temp.textContent =
                        `${Math.round(day.max)}° / `
                        + `${Math.round(day.min)}°`;

                    const rain = document.createElement("span");
                    rain.className = "forecast-rain";
                    rain.textContent =
                        `${Math.round(day.chance * 100)}% · `
                        + `${day.amount.toFixed(1)} мм`;

                    values.append(temp, rain);
                    row.append(info, icon, values);

                    return row;
                }
            );

            elements.daily.replaceChildren(...rows);
        }

        function aqiText(value) {
            return {
                1: "Хорошее",
                2: "Удовлетворительное",
                3: "Умеренное",
                4: "Плохое",
                5: "Очень плохое",
            }[value] ?? "Нет данных";
        }

        function pollutant(name, value) {
            const item = document.createElement("div");
            item.className = "pollutant";

            const label = document.createElement("span");
            label.className = "pollutant-name";
            label.textContent = name;

            const number = document.createElement("span");
            number.className = "pollutant-value";
            number.textContent =
                Number.isFinite(value)
                    ? value.toFixed(1)
                    : "—";

            item.append(label, number);
            return item;
        }

        function renderPollution(pollutionData) {
            const item = pollutionData?.list?.[0];

            if (!item) {
                elements.aqiNumber.textContent = "—";
                elements.aqiStatus.textContent =
                    "Данные недоступны";
                elements.pollutants.replaceChildren();
                return;
            }

            const aqi = item.main.aqi;
            const values = item.components;

            elements.aqiNumber.textContent = String(aqi);
            elements.aqiStatus.textContent = aqiText(aqi);

            elements.pollutants.replaceChildren(
                pollutant("PM2.5", values.pm2_5),
                pollutant("PM10", values.pm10),
                pollutant("CO", values.co),
                pollutant("NO₂", values.no2),
                pollutant("SO₂", values.so2),
                pollutant("O₃", values.o3)
            );
        }

        function showLoading() {
            elements.loading.classList.remove("hidden");
            elements.error.classList.add("hidden");
            elements.content.classList.add("hidden");
        }

        function showError(message) {
            elements.loading.classList.add("hidden");
            elements.content.classList.add("hidden");
            elements.errorText.textContent = message;
            elements.error.classList.remove("hidden");
        }

        function showContent() {
            elements.loading.classList.add("hidden");
            elements.error.classList.add("hidden");
            elements.content.classList.remove("hidden");
        }

        async function start() {
            if (!OPENWEATHER_API_KEY) {
                showError(
                    "В ссылке отсутствует ключ OpenWeather. "
                    + "Открой приложение через новую кнопку бота."
                );
                return;
            }

            if (!REQUESTED_CITY) {
                showError(
                    "В ссылке отсутствует город. "
                    + "Используй команду /weather НазваниеГорода."
                );
                return;
            }

            elements.pageTitle.textContent = REQUESTED_CITY;
            showLoading();

            try {
                const location = await findCity(REQUESTED_CITY);
                const data = await loadWeather(location);

                renderCurrent(data.current, location);
                renderHourly(data.forecast);
                renderForecast(data.forecast);
                renderPollution(data.pollution);

                showContent();
            } catch (error) {
                console.error(error);

                showError(
                    error instanceof Error
                        ? error.message
                        : "Произошла неизвестная ошибка."
                );
            }
        }

        elements.retry.addEventListener("click", start);

        initializeTelegram();
        start();
    </script>
</body>
</html>
