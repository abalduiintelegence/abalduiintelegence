<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >
    <meta name="theme-color" content="#080808">
    <title>Monochrome Weather</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            color-scheme: dark;

            --background: #080808;
            --surface: #111111;
            --surface-soft: #171717;
            --text: #f4f4f4;
            --muted: #969696;
            --faint: #666666;
            --border: #292929;
            --border-strong: #454545;
            --white: #ffffff;
            --black: #000000;
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            background: var(--background);
        }

        body {
            min-height: 100vh;
            margin: 0;
            color: var(--text);
            background: var(--background);
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        button {
            font: inherit;
        }

        .hidden {
            display: none !important;
        }

        .app {
            width: min(100%, 760px);
            margin: 0 auto;
            padding:
                calc(14px + env(safe-area-inset-top))
                14px
                calc(36px + env(safe-area-inset-bottom));
        }

        .top-line {
            height: 1px;
            margin-bottom: 14px;
            background:
                linear-gradient(
                    90deg,
                    transparent,
                    var(--border-strong),
                    transparent
                );
        }

        .card,
        .greeting {
            display: flex;
            align-items: center;
            gap: 11px;
            width: fit-content;
            max-width: 100%;
            animation: slide-down 0.55s cubic-bezier(.2, .8, .2, 1) both;
        }

        .avatar {
            display: grid;
            place-items: center;
            width: 46px;
            min-width: 46px;
            height: 46px;
            overflow: hidden;
            border: 1px solid var(--border-strong);
            border-radius: 50%;
            color: var(--black);
            background: var(--white);
            font-size: 15px;
            font-weight: 700;
            box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.18);
            animation: avatar-pulse 3s ease-in-out infinite;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .greeting-text {
            min-width: 0;
            margin: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .page-header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 16px;
            margin: 24px 2px 14px;
        }


        .page-title {
            margin: 0;
            font-size: clamp(26px, 7vw, 42px);
            font-weight: 500;
            letter-spacing: -0.04em;
        }

        .updated {
            margin: 0 0 4px;
            color: var(--muted);
            font-size: 12px;
            text-align: right;
        }

        .card {
            margin-top: 12px;
            padding: 18px;
        }

        .loading {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .loader {
            width: 19px;
            height: 19px;
            border: 2px solid var(--border-strong);
            border-top-color: var(--white);
            border-radius: 50%;
            animation: rotation 0.75s linear infinite;
        }

        @keyframes rotation {
            to {
                transform: rotate(360deg);
            }
        }

        .error-title {
            margin: 0 0 8px;
            font-size: 17px;
        }

        .error-text {
            margin: 0;
            color: var(--muted);
            line-height: 1.55;
        }

        .button {
            width: 100%;
            margin-top: 15px;
            padding: 13px 16px;
            border: 1px solid var(--white);
            border-radius: 12px;
            color: var(--black);
            background: var(--white);
            font-weight: 650;
            cursor: pointer;
        }

        .button:active {
            transform: translateY(1px);
        }

        .current {
            display: grid;
            grid-template-columns:
                minmax(0, 1.25fr)
                minmax(160px, 0.75fr);
            gap: 12px;
        }

        .current-primary {
            min-height: 265px;
        }

        .location-line {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-bottom: 25px;
            color: var(--muted);
            font-size: 13px;
        }

        .location-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--white);
        }

        .temperature-line {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
        }

        .temperature {
            margin: 0;
            font-size: clamp(72px, 20vw, 116px);
            font-weight: 400;
            letter-spacing: -0.09em;
            line-height: 0.86;
        }

        .weather-symbol {
            display: grid;
            place-items: center;
            width: 54px;
            height: 54px;
            border: 1px solid var(--border-strong);
            border-radius: 50%;
            font-size: 26px;
        }

        .condition {
            margin: 22px 0 0;
            font-size: 20px;
            font-weight: 500;
        }

        .feels {
            margin: 7px 0 0;
            color: var(--muted);
            font-size: 14px;
        }

        .metric-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1px;
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 18px;
            background: var(--border);
        }

        .metric {
            min-height: 104px;
            padding: 14px;
            background: var(--surface);
        }

        .metric-label {
            display: block;
            margin-bottom: 11px;
            color: var(--muted);
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .metric-value {
            display: block;
            font-size: 21px;
            font-weight: 550;
        }

        .metric-detail {
            display: block;
            margin-top: 5px;
            color: var(--faint);
            font-size: 11px;
        }

        .section-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 16px;
        }

        .section-title {
            margin: 0;
            font-size: 17px;
            font-weight: 550;
        }

        .section-note {
            margin: 0;
            color: var(--muted);
            font-size: 11px;
        }

        .hourly-scroll {
            display: grid;
            grid-auto-flow: column;
            grid-auto-columns: minmax(94px, 1fr);
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 5px;
            scrollbar-width: thin;
            scrollbar-color: var(--border-strong) transparent;
        }

        .hour-card {
            padding: 13px 10px;
            border: 1px solid var(--border);
            border-radius: 14px;
            text-align: center;
            background: var(--surface-soft);
        }

        .hour-time {
            margin: 0;
            color: var(--muted);
            font-size: 12px;
        }

        .hour-icon {
            display: block;
            margin: 13px 0;
            font-size: 25px;
        }

        .hour-temp {
            margin: 0;
            font-size: 20px;
            font-weight: 600;
        }

        .hour-extra {
            margin: 8px 0 0;
            color: var(--muted);
            font-size: 11px;
        }

        .days {
            display: grid;
            gap: 1px;
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 15px;
            background: var(--border);
        }

        .day {
            display: grid;
            grid-template-columns:
                minmax(100px, 1fr)
                45px
                minmax(110px, 0.8fr);
            align-items: center;
            gap: 10px;
            min-height: 67px;
            padding: 10px 13px;
            background: var(--surface-soft);
        }

        .day-name {
            margin: 0;
            font-size: 14px;
        }

        .day-description {
            display: block;
            margin-top: 4px;
            color: var(--muted);
            font-size: 11px;
        }

        .day-icon {
            text-align: center;
            font-size: 23px;
        }

        .day-values {
            text-align: right;
        }

        .day-temp {
            display: block;
            font-size: 16px;
            font-weight: 600;
        }

        .day-rain {
            display: block;
            margin-top: 5px;
            color: var(--muted);
            font-size: 11px;
        }

        .sun-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .sun-item {
            padding: 15px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: var(--surface-soft);
        }

        .sun-label {
            display: block;
            color: var(--muted);
            font-size: 11px;
            text-transform: uppercase;
        }

        .sun-value {
            display: block;
            margin-top: 8px;
            font-size: 22px;
        }

        .aqi-layout {
            display: grid;
            grid-template-columns: 150px 1fr;
            gap: 12px;
        }

        .aqi-main {
            display: grid;
            align-content: center;
            min-height: 150px;
            padding: 18px;
            border: 1px solid var(--border);
            border-radius: 15px;
            background: var(--surface-soft);
        }

        .aqi-number {
            margin: 0;
            font-size: 61px;
            font-weight: 400;
            letter-spacing: -0.07em;
            line-height: 1;
        }

        .aqi-status {
            margin: 9px 0 0;
            color: var(--muted);
            font-size: 13px;
        }

        .pollutants {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .pollutant {
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 13px;
            background: var(--surface-soft);
        }

        .pollutant-name {
            display: block;
            color: var(--muted);
            font-size: 10px;
        }

        .pollutant-value {
            display: block;
            margin-top: 8px;
            font-family:
                ui-monospace,
                SFMono-Regular,
                Menlo,
                monospace;
            font-size: 13px;
        }

        .footer {
            padding: 24px 4px 0;
            color: var(--faint);
            font-size: 11px;
            line-height: 1.6;
            text-align: center;
        }


        .page-header {
            animation: fade-up 0.6s 0.08s cubic-bezier(.2, .8, .2, 1) both;
        }

        #weather-content > * {
            animation: fade-up 0.58s cubic-bezier(.2, .8, .2, 1) both;
        }

        #weather-content > *:nth-child(1) {
            animation-delay: 0.04s;
        }

        #weather-content > *:nth-child(2) {
            animation-delay: 0.10s;
        }

        #weather-content > *:nth-child(3) {
            animation-delay: 0.16s;
        }

        #weather-content > *:nth-child(4) {
            animation-delay: 0.22s;
        }

        #weather-content > *:nth-child(5) {
            animation-delay: 0.28s;
        }

        .card,
        .metric,
        .hour-card,
        .day,
        .sun-item,
        .pollutant {
            transition:
                transform 0.22s ease,
                border-color 0.22s ease,
                background-color 0.22s ease;
        }

        .hour-card:active,
        .day:active,
        .sun-item:active,
        .pollutant:active {
            transform: scale(0.975);
        }

        .weather-symbol {
            overflow: hidden;
            animation: weather-float 3.4s ease-in-out infinite;
        }

        .weather-symbol img {
            width: 64px;
            height: 64px;
            object-fit: contain;
            filter: grayscale(1) contrast(1.2);
            transform: scale(1.18);
        }

        .hour-icon,
        .day-icon {
            display: grid;
            place-items: center;
        }

        .hour-icon img {
            width: 46px;
            height: 46px;
            object-fit: contain;
            filter: grayscale(1) contrast(1.15);
        }

        .day-icon img {
            width: 44px;
            height: 44px;
            object-fit: contain;
            filter: grayscale(1) contrast(1.15);
        }

        .temperature {
            animation: temperature-in 0.75s cubic-bezier(.15, .85, .2, 1) both;
        }

        @keyframes slide-down {
            from {
                opacity: 0;
                transform: translateY(-12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fade-up {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes temperature-in {
            from {
                opacity: 0;
                transform: translateY(12px) scale(0.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes weather-float {
            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-5px);
            }
        }

        @keyframes avatar-pulse {
            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(255, 255, 255, 0);
            }

            50% {
                box-shadow: 0 0 0 5px rgba(255, 255, 255, 0.055);
            }
        }

        @media (hover: hover) {
            .hour-card:hover,
            .day:hover,
            .sun-item:hover,
            .pollutant:hover {
                transform: translateY(-2px);
                border-color: var(--border-strong);
                background: #1b1b1b;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        @media (max-width: 620px) {
            .current {
                grid-template-columns: 1fr;
            }

            .current-primary {
                min-height: 240px;
            }

            .aqi-layout {
                grid-template-columns: 1fr;
            }

            .pollutants {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 390px) {
            .app {
                padding-inline: 10px;
            }

            .page-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .updated {
                text-align: left;
            }

            .day {
                grid-template-columns:
                    minmax(80px, 1fr)
                    35px
                    90px;
            }
        }
    </style>
</head>

<body>
    <main class="app">
        <div class="top-line"></div>

        <section class="greeting" aria-label="Приветствие пользователя">
            <div id="avatar" class="avatar">TG</div>

            <p id="greeting-text" class="greeting-text">
                Привет!
            </p>
        </section>

        <header class="page-header">
            <div>
                <h1 id="page-title" class="page-title">Погода</h1>
            </div>

            <p id="updated" class="updated"></p>
        </header>

        <section id="loading-card" class="card loading">
            <div class="loader"></div>
            <span>Получаем погодные данные…</span>
        </section>

        <section id="error-card" class="card hidden">
            <h2 class="error-title">Ошибка загрузки</h2>
            <p id="error-text" class="error-text"></p>

            <button id="retry-button" class="button" type="button">
                Повторить
            </button>
        </section>

        <div id="weather-content" class="hidden">
            <section class="current">
                <article class="card current-primary">
                    <div class="location-line">
                        <span class="location-dot"></span>
                        <span id="location-name"></span>
                    </div>

                    <div class="temperature-line">
                        <p id="current-temperature" class="temperature">—</p>
                        <div id="current-icon" class="weather-symbol">—</div>
                    </div>

                    <p id="current-condition" class="condition"></p>
                    <p id="current-feels" class="feels"></p>
                </article>

                <section id="metrics" class="metric-grid"></section>
            </section>

            <section class="card">
                <div class="section-header">
                    <h2 class="section-title">Сегодня</h2>
                    <p class="section-note">шаг прогноза — 3 часа</p>
                </div>

                <div id="hourly-list" class="hourly-scroll"></div>
            </section>

            <section class="card">
                <div class="section-header">
                    <h2 class="section-title">Пять дней</h2>
                    <p class="section-note">OpenWeather Forecast</p>
                </div>

                <div id="daily-list" class="days"></div>
            </section>

            <section class="card">
                <div class="section-header">
                    <h2 class="section-title">Световой день</h2>
                </div>

                <div class="sun-grid">
                    <div class="sun-item">
                        <span class="sun-label">Восход</span>
                        <span id="sunrise" class="sun-value"></span>
                    </div>

                    <div class="sun-item">
                        <span class="sun-label">Закат</span>
                        <span id="sunset" class="sun-value"></span>
                    </div>
                </div>
            </section>

            <section class="card">
                <div class="section-header">
                    <h2 class="section-title">Качество воздуха</h2>
                    <p class="section-note">μg/m³</p>
                </div>

                <div class="aqi-layout">
                    <div class="aqi-main">
                        <p id="aqi-number" class="aqi-number">—</p>
                        <p id="aqi-status" class="aqi-status"></p>
                    </div>

                    <div id="pollutants" class="pollutants"></div>
                </div>
            </section>

            <footer class="footer">
                Погодные данные предоставлены OpenWeather.
                Профиль предоставлен Telegram Mini Apps.
            </footer>
        </div>
    </main>

    <script>
        const telegram = window.Telegram?.WebApp;

        function readUrlParameters() {
            const params = new URLSearchParams(window.location.search);

            return {
                city: params.get("city")?.trim() ?? "",
                apiKey: params.get("key")?.trim() ?? "",
            };
        }

        const requestParameters = readUrlParameters();
        const REQUESTED_CITY = requestParameters.city;
        const OPENWEATHER_API_KEY = requestParameters.apiKey;

        function removeApiKeyFromAddressBar() {
            if (!OPENWEATHER_API_KEY) {
                return;
            }

            const cleanUrl = new URL(window.location.href);
            cleanUrl.searchParams.delete("key");

            window.history.replaceState(
                {},
                document.title,
                cleanUrl.toString()
            );
        }

        removeApiKeyFromAddressBar();

        const elements = {
            loading: document.getElementById("loading-card"),
            error: document.getElementById("error-card"),
            errorText: document.getElementById("error-text"),
            retry: document.getElementById("retry-button"),
            content: document.getElementById("weather-content"),

            avatar: document.getElementById("avatar"),
            greetingText: document.getElementById("greeting-text"),

            pageTitle: document.getElementById("page-title"),
            updated: document.getElementById("updated"),
            locationName: document.getElementById("location-name"),
            currentTemperature:
                document.getElementById("current-temperature"),
            currentIcon: document.getElementById("current-icon"),
            currentCondition:
                document.getElementById("current-condition"),
            currentFeels: document.getElementById("current-feels"),

            metrics: document.getElementById("metrics"),
            hourly: document.getElementById("hourly-list"),
            daily: document.getElementById("daily-list"),

            sunrise: document.getElementById("sunrise"),
            sunset: document.getElementById("sunset"),

            aqiNumber: document.getElementById("aqi-number"),
            aqiStatus: document.getElementById("aqi-status"),
            pollutants: document.getElementById("pollutants"),
        };

        function initializeTelegram() {
            if (!telegram) {
                renderTelegramProfile(null);
                return;
            }

            telegram.ready();
            telegram.expand();

            try {
                telegram.setHeaderColor("#080808");
                telegram.setBackgroundColor("#080808");

                if (typeof telegram.setBottomBarColor === "function") {
                    telegram.setBottomBarColor("#080808");
                }
            } catch (error) {
                console.debug(
                    "Некоторые методы оформления Telegram недоступны:",
                    error
                );
            }

            renderTelegramProfile(
                telegram.initDataUnsafe?.user ?? null
            );
        }

        function getInitials(user) {
            if (!user) {
                return "TG";
            }

            return [
                user.first_name,
                user.last_name,
            ]
                .filter(Boolean)
                .map((value) => value.trim().charAt(0))
                .join("")
                .slice(0, 2)
                .toUpperCase() || "TG";
        }

        function renderTelegramProfile(user) {
            if (!user) {
                elements.avatar.textContent = "TG";
                elements.greetingText.textContent = "Привет!";
                return;
            }

            const displayName =
                user.username
                    ? user.username
                    : user.first_name || "друг";

            elements.greetingText.textContent =
                `Привет, ${displayName}`;

            elements.avatar.textContent = getInitials(user);

            if (user.photo_url) {
                const image = document.createElement("img");

                image.src = user.photo_url;
                image.alt = `Аватар ${displayName}`;
                image.referrerPolicy = "no-referrer";

                image.addEventListener(
                    "error",
                    () => {
                        elements.avatar.textContent = getInitials(user);
                    },
                    { once: true }
                );

                elements.avatar.replaceChildren(image);
            }
        }

        function apiUrl(path, parameters) {
            const query = new URLSearchParams({
                ...parameters,
                appid: OPENWEATHER_API_KEY,
            });

            return `https://api.openweathermap.org${path}?${query}`;
        }

        async function fetchJson(url, errorMessage) {
            let response;

            try {
                response = await fetch(url);
            } catch {
                throw new Error(
                    "Не удалось подключиться к погодному сервису."
                );
            }

            let data;

            try {
                data = await response.json();
            } catch {
                throw new Error(errorMessage);
            }

            if (!response.ok) {
                const apiMessage =
                    typeof data?.message === "string"
                        ? data.message
                        : "";

                throw new Error(
                    apiMessage
                        ? `${errorMessage} ${apiMessage}`
                        : errorMessage
                );
            }

            return data;
        }

        async function geocodeCity(city) {
            const query = new URLSearchParams({
                q: city,
                limit: "1",
                appid: OPENWEATHER_API_KEY,
            });

            const data = await fetchJson(
                `https://api.openweathermap.org/geo/1.0/direct?${query}`,
                "Не удалось найти город."
            );

            if (!Array.isArray(data) || data.length === 0) {
                throw new Error(
                    `Город «${city}» не найден. Проверь написание.`
                );
            }

            return data[0];
        }

        async function loadAllWeather(location) {
            const common = {
                lat: String(location.lat),
                lon: String(location.lon),
                units: "metric",
                lang: "ru",
            };

            const requests = await Promise.allSettled([
                fetchJson(
                    apiUrl("/data/2.5/weather", common),
                    "Не удалось получить текущую погоду."
                ),
                fetchJson(
                    apiUrl("/data/2.5/forecast", common),
                    "Не удалось получить прогноз."
                ),
                fetchJson(
                    apiUrl("/data/2.5/air_pollution", {
                        lat: common.lat,
                        lon: common.lon,
                    }),
                    "Не удалось получить качество воздуха."
                ),
            ]);

            const [currentResult, forecastResult, pollutionResult] = requests;

            if (currentResult.status === "rejected") {
                throw currentResult.reason;
            }

            if (forecastResult.status === "rejected") {
                throw forecastResult.reason;
            }

            return {
                current: currentResult.value,
                forecast: forecastResult.value,
                pollution:
                    pollutionResult.status === "fulfilled"
                        ? pollutionResult.value
                        : null,
            };
        }

        function weatherIconUrl(iconCode, size = "2x") {
            if (!iconCode) {
                return "";
            }

            const suffix = size ? `@${size}` : "";

            return (
                "https://openweathermap.org/img/wn/"
                + `${iconCode}${suffix}.png`
            );
        }

        function createWeatherIcon(iconCode, altText, className = "") {
            const image = document.createElement("img");

            image.src = weatherIconUrl(iconCode);
            image.alt = altText || "Погодные условия";
            image.loading = "lazy";
            image.decoding = "async";

            if (className) {
                image.className = className;
            }

            image.addEventListener(
                "error",
                () => {
                    image.replaceWith(
                        document.createTextNode("◌")
                    );
                },
                { once: true }
            );

            return image;
        }

        function capitalize(value) {
            if (!value) {
                return "";
            }

            return value.charAt(0).toUpperCase() + value.slice(1);
        }

        function compassDirection(degrees = 0) {
            const directions = [
                "С",
                "СВ",
                "В",
                "ЮВ",
                "Ю",
                "ЮЗ",
                "З",
                "СЗ",
            ];

            return directions[
                Math.round(degrees / 45) % directions.length
            ];
        }

        function formatCityTime(
            timestamp,
            timezoneOffset,
            options
        ) {
            return new Intl.DateTimeFormat(
                "ru-RU",
                {
                    ...options,
                    timeZone: "UTC",
                }
            ).format(
                new Date((timestamp + timezoneOffset) * 1000)
            );
        }

        function unixTime(timestamp, timezoneOffset) {
            return formatCityTime(
                timestamp,
                timezoneOffset,
                {
                    hour: "2-digit",
                    minute: "2-digit",
                }
            );
        }

        function localDateKey(timestamp, timezoneOffset) {
            return new Date(
                (timestamp + timezoneOffset) * 1000
            )
                .toISOString()
                .slice(0, 10);
        }

        function localHour(timestamp, timezoneOffset) {
            return formatCityTime(
                timestamp,
                timezoneOffset,
                {
                    hour: "2-digit",
                    minute: "2-digit",
                }
            );
        }

        function formatUpdated(timestamp, timezoneOffset) {
            return formatCityTime(
                timestamp,
                timezoneOffset,
                {
                    day: "numeric",
                    month: "short",
                    hour: "2-digit",
                    minute: "2-digit",
                }
            );
        }

        function createMetric(label, value, detail = "") {
            const metric = document.createElement("div");
            metric.className = "metric";

            const labelElement = document.createElement("span");
            labelElement.className = "metric-label";
            labelElement.textContent = label;

            const valueElement = document.createElement("span");
            valueElement.className = "metric-value";
            valueElement.textContent = value;

            metric.append(labelElement, valueElement);

            if (detail) {
                const detailElement = document.createElement("span");
                detailElement.className = "metric-detail";
                detailElement.textContent = detail;
                metric.append(detailElement);
            }

            return metric;
        }

        function renderCurrent(current, location) {
            const condition = current.weather?.[0] ?? {};

            const locationName = [
                location.name,
                location.state,
                location.country,
            ]
                .filter(Boolean)
                .filter(
                    (value, index, array) =>
                        array.indexOf(value) === index
                )
                .join(", ");

            elements.pageTitle.textContent =
                location.name || REQUESTED_CITY;

            elements.locationName.textContent = locationName;

            elements.currentTemperature.textContent =
                `${Math.round(current.main.temp)}°`;

            elements.currentIcon.replaceChildren(
                createWeatherIcon(
                    condition.icon,
                    condition.description || "Текущая погода"
                )
            );

            elements.currentCondition.textContent =
                capitalize(condition.description);

            elements.currentFeels.textContent =
                `Ощущается как ${Math.round(
                    current.main.feels_like
                )} °C`;

            elements.updated.textContent =
                `Обновлено ${formatUpdated(
                    current.dt,
                    current.timezone
                )}`;

            const windDegrees = current.wind?.deg ?? 0;

            elements.metrics.replaceChildren(
                createMetric(
                    "Влажность",
                    `${current.main.humidity}%`
                ),
                createMetric(
                    "Давление",
                    `${current.main.pressure} hPa`
                ),
                createMetric(
                    "Ветер",
                    `${(current.wind?.speed ?? 0).toFixed(1)} м/с`,
                    `${compassDirection(windDegrees)}, ${windDegrees}°`
                ),
                createMetric(
                    "Порывы",
                    Number.isFinite(current.wind?.gust)
                        ? `${current.wind.gust.toFixed(1)} м/с`
                        : "—"
                ),
                createMetric(
                    "Облачность",
                    `${current.clouds?.all ?? 0}%`
                ),
                createMetric(
                    "Видимость",
                    Number.isFinite(current.visibility)
                        ? `${(current.visibility / 1000).toFixed(1)} км`
                        : "—"
                ),
                createMetric(
                    "Минимум",
                    `${Math.round(current.main.temp_min)}°`
                ),
                createMetric(
                    "Максимум",
                    `${Math.round(current.main.temp_max)}°`
                )
            );

            elements.sunrise.textContent = unixTime(
                current.sys.sunrise,
                current.timezone
            );

            elements.sunset.textContent = unixTime(
                current.sys.sunset,
                current.timezone
            );
        }

        function getPrecipitation(item) {
            return (
                (item.rain?.["3h"] ?? 0)
                + (item.snow?.["3h"] ?? 0)
            );
        }

        function renderToday(forecast) {
            const timezoneOffset = forecast.city.timezone;
            const nowTimestamp = Math.floor(Date.now() / 1000);

            const availableItems = forecast.list.filter(
                (item) => item.dt >= nowTimestamp - 3600
            );

            const firstItem = availableItems[0] ?? forecast.list[0];

            if (!firstItem) {
                elements.hourly.textContent = "Прогноз недоступен.";
                return;
            }

            const todayKey = localDateKey(
                firstItem.dt,
                timezoneOffset
            );

            const todayItems = availableItems.filter(
                (item) =>
                    localDateKey(item.dt, timezoneOffset) === todayKey
            );

            const cards = todayItems.map((item) => {
                const card = document.createElement("article");
                card.className = "hour-card";

                const time = document.createElement("p");
                time.className = "hour-time";
                time.textContent = localHour(
                    item.dt,
                    timezoneOffset
                );

                const icon = document.createElement("span");
                icon.className = "hour-icon";
                const weather = item.weather?.[0] ?? {};

                icon.append(
                    createWeatherIcon(
                        weather.icon,
                        weather.description || "Прогноз"
                    )
                );

                const temperature = document.createElement("p");
                temperature.className = "hour-temp";
                temperature.textContent =
                    `${Math.round(item.main.temp)}°`;

                const precipitation = document.createElement("p");
                precipitation.className = "hour-extra";

                const amount = getPrecipitation(item);
                const probability = Math.round(
                    (item.pop ?? 0) * 100
                );

                precipitation.textContent =
                    amount > 0
                        ? `${amount.toFixed(1)} мм · ${probability}%`
                        : `${probability}% осадков`;

                card.append(
                    time,
                    icon,
                    temperature,
                    precipitation
                );

                return card;
            });

            elements.hourly.replaceChildren(...cards);
        }

        function aggregateDailyForecast(forecast) {
            const timezoneOffset = forecast.city.timezone;
            const groups = new Map();

            for (const item of forecast.list) {
                const dateKey = localDateKey(
                    item.dt,
                    timezoneOffset
                );

                if (!groups.has(dateKey)) {
                    groups.set(dateKey, []);
                }

                groups.get(dateKey).push(item);
            }

            return Array.from(groups.entries())
                .slice(0, 5)
                .map(([dateKey, items]) => {
                    const temperatures = items.map(
                        (item) => item.main.temp
                    );

                    const representative = items.reduce(
                        (best, item) => {
                            const hour = Number(
                                localHour(
                                    item.dt,
                                    timezoneOffset
                                ).slice(0, 2)
                            );

                            const bestHour = Number(
                                localHour(
                                    best.dt,
                                    timezoneOffset
                                ).slice(0, 2)
                            );

                            return Math.abs(hour - 12)
                                < Math.abs(bestHour - 12)
                                ? item
                                : best;
                        }
                    );

                    return {
                        dateKey,
                        min: Math.min(...temperatures),
                        max: Math.max(...temperatures),
                        probability: Math.max(
                            ...items.map((item) => item.pop ?? 0)
                        ),
                        precipitation: items.reduce(
                            (sum, item) =>
                                sum + getPrecipitation(item),
                            0
                        ),
                        representative,
                    };
                });
        }

        function formatDay(dateKey, index) {
            if (index === 0) return "Сегодня";
            if (index === 1) return "Завтра";

            return new Intl.DateTimeFormat(
                "ru-RU",
                {
                    weekday: "short",
                    day: "numeric",
                    month: "short",
                    timeZone: "UTC",
                }
            ).format(
                new Date(`${dateKey}T12:00:00Z`)
            );
        }

        function renderFiveDays(forecast) {
            const rows = aggregateDailyForecast(forecast).map(
                (day, index) => {
                    const row = document.createElement("article");
                    row.className = "day";

                    const nameWrapper = document.createElement("div");

                    const name = document.createElement("p");
                    name.className = "day-name";
                    name.textContent = formatDay(day.dateKey, index);

                    const description = document.createElement("span");
                    description.className = "day-description";
                    description.textContent = capitalize(
                        day.representative.weather?.[0]?.description
                    );

                    nameWrapper.append(name, description);

                    const icon = document.createElement("div");
                    icon.className = "day-icon";
                    const representativeWeather =
                        day.representative.weather?.[0] ?? {};

                    icon.append(
                        createWeatherIcon(
                            representativeWeather.icon,
                            representativeWeather.description
                                || "Прогноз на день"
                        )
                    );

                    const values = document.createElement("div");
                    values.className = "day-values";

                    const temperature = document.createElement("span");
                    temperature.className = "day-temp";
                    temperature.textContent =
                        `${Math.round(day.max)}° / `
                        + `${Math.round(day.min)}°`;

                    const rain = document.createElement("span");
                    rain.className = "day-rain";
                    rain.textContent =
                        `${Math.round(day.probability * 100)}% · `
                        + `${day.precipitation.toFixed(1)} мм`;

                    values.append(temperature, rain);
                    row.append(nameWrapper, icon, values);

                    return row;
                }
            );

            elements.daily.replaceChildren(...rows);
        }

        function aqiDescription(aqi) {
            return {
                1: "Хорошее",
                2: "Удовлетворительное",
                3: "Умеренное",
                4: "Плохое",
                5: "Очень плохое",
            }[aqi] ?? "Нет данных";
        }

        function createPollutant(name, value) {
            const item = document.createElement("div");
            item.className = "pollutant";

            const nameElement = document.createElement("span");
            nameElement.className = "pollutant-name";
            nameElement.textContent = name;

            const valueElement = document.createElement("span");
            valueElement.className = "pollutant-value";
            valueElement.textContent =
                Number.isFinite(value)
                    ? value.toFixed(1)
                    : "—";

            item.append(nameElement, valueElement);
            return item;
        }

        function renderAirPollution(pollution) {
            const entry = pollution?.list?.[0];

            if (!entry) {
                elements.aqiNumber.textContent = "—";
                elements.aqiStatus.textContent = "Данные недоступны";
                elements.pollutants.replaceChildren();
                return;
            }

            const aqi = entry.main.aqi;
            const values = entry.components;

            elements.aqiNumber.textContent = String(aqi);
            elements.aqiStatus.textContent = aqiDescription(aqi);

            elements.pollutants.replaceChildren(
                createPollutant("PM2.5", values.pm2_5),
                createPollutant("PM10", values.pm10),
                createPollutant("CO", values.co),
                createPollutant("NO₂", values.no2),
                createPollutant("SO₂", values.so2),
                createPollutant("O₃", values.o3)
            );
        }

        function showLoading() {
            elements.loading.classList.remove("hidden");
            elements.error.classList.add("hidden");
            elements.content.classList.add("hidden");
        }

        function showError(message) {
            elements.loading.classList.add("hidden");
            elements.content.classList.add("hidden");
            elements.errorText.textContent = message;
            elements.error.classList.remove("hidden");
        }

        function showWeather() {
            elements.loading.classList.add("hidden");
            elements.error.classList.add("hidden");
            elements.content.classList.remove("hidden");
        }

        async function start() {
            if (!OPENWEATHER_API_KEY) {
                showError(
                    "В ссылке отсутствует параметр key. "
                    + "Открой приложение через кнопку Telegram-бота."
                );
                return;
            }

            if (!REQUESTED_CITY) {
                showError(
                    "В ссылке отсутствует параметр city. "
                    + "Открой приложение командой "
                    + "/weather НазваниеГорода."
                );
                return;
            }

            elements.pageTitle.textContent = REQUESTED_CITY;
            showLoading();

            try {
                const location = await geocodeCity(REQUESTED_CITY);
                const weather = await loadAllWeather(location);

                renderCurrent(weather.current, location);
                renderToday(weather.forecast);
                renderFiveDays(weather.forecast);
                renderAirPollution(weather.pollution);

                showWeather();
            } catch (error) {
                console.error(error);

                showError(
                    error instanceof Error
                        ? error.message
                        : "Произошла неизвестная ошибка."
                );
            }
        }

        elements.retry.addEventListener("click", start);

        initializeTelegram();
        start();
    </script>
</body>
</html>
