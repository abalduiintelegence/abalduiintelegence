<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#172033"
    >

    <title>Погода</title>

    <!-- Официальная библиотека Telegram Mini Apps -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            color-scheme: light dark;

            --background: #101827;
            --card: rgba(255, 255, 255, 0.09);
            --card-border: rgba(255, 255, 255, 0.14);
            --text: #f6f8ff;
            --muted: #b8c1d9;
            --accent: #69b7ff;
            --danger: #ff8c8c;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 20px;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            color: var(--text);

            background:
                radial-gradient(
                    circle at top,
                    #23436b 0,
                    var(--background) 55%
                );
        }

        .container {
            width: 100%;
            max-width: 620px;
            margin: 0 auto;
        }

        .header {
            margin-bottom: 18px;
        }

        .header h1 {
            margin: 0 0 6px;
            font-size: 28px;
        }

        .header p {
            margin: 0;
            color: var(--muted);
        }

        .card {
            margin-bottom: 14px;
            padding: 20px;

            border: 1px solid var(--card-border);
            border-radius: 22px;

            background: var(--card);
            backdrop-filter: blur(14px);
        }

        .loading {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .spinner {
            width: 24px;
            height: 24px;

            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top-color: var(--accent);
            border-radius: 50%;

            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .hidden {
            display: none;
        }

        .location {
            margin-bottom: 5px;

            color: var(--muted);
            font-size: 15px;
        }

        .current-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .temperature {
            margin: 0;

            font-size: 58px;
            font-weight: 700;
            line-height: 1;
        }

        .weather-icon {
            font-size: 68px;
            line-height: 1;
        }

        .description {
            margin: 10px 0 0;
            font-size: 20px;
        }

        .details {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            margin-top: 18px;
        }

        .detail {
            padding: 13px;

            border-radius: 15px;
            background: rgba(255, 255, 255, 0.07);
        }

        .detail-label {
            display: block;
            margin-bottom: 5px;

            color: var(--muted);
            font-size: 13px;
        }

        .detail-value {
            font-size: 17px;
            font-weight: 600;
        }

        .forecast-title {
            margin: 0 0 14px;
            font-size: 19px;
        }

        .forecast-list {
            display: grid;
            gap: 9px;
        }

        .forecast-day {
            display: grid;
            grid-template-columns: 1.4fr 45px 1fr;
            align-items: center;
            gap: 10px;

            padding: 12px 4px;

            border-bottom: 1px solid var(--card-border);
        }

        .forecast-day:last-child {
            border-bottom: 0;
        }

        .forecast-icon {
            text-align: center;
            font-size: 25px;
        }

        .forecast-temp {
            text-align: right;
        }

        .temp-min {
            color: var(--muted);
        }

        .error {
            color: var(--danger);
        }

        .retry-button {
            width: 100%;
            margin-top: 14px;
            padding: 13px 18px;

            border: 0;
            border-radius: 14px;

            color: #07111f;
            background: var(--accent);

            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        @media (max-width: 420px) {
            body {
                padding: 14px;
            }

            .temperature {
                font-size: 48px;
            }

            .weather-icon {
                font-size: 56px;
            }

            .details {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <header class="header">
            <h1>Прогноз погоды</h1>
            <p id="requested-city">
                Определяем город…
            </p>
        </header>

        <section
            id="loading-card"
            class="card loading"
        >
            <div class="spinner"></div>

            <div>
                Загружаем актуальные данные…
            </div>
        </section>

        <section
            id="error-card"
            class="card hidden"
        >
            <h2>Не удалось получить погоду</h2>

            <p
                id="error-text"
                class="error"
            ></p>

            <button
                id="retry-button"
                class="retry-button"
                type="button"
            >
                Попробовать снова
            </button>
        </section>

        <section
            id="weather-card"
            class="card hidden"
        >
            <div
                id="location"
                class="location"
            ></div>

            <div class="current-row">
                <div>
                    <p
                        id="temperature"
                        class="temperature"
                    ></p>

                    <p
                        id="description"
                        class="description"
                    ></p>
                </div>

                <div
                    id="weather-icon"
                    class="weather-icon"
                ></div>
            </div>

            <div class="details">
                <div class="detail">
                    <span class="detail-label">
                        Ощущается как
                    </span>

                    <span
                        id="feels-like"
                        class="detail-value"
                    ></span>
                </div>

                <div class="detail">
                    <span class="detail-label">
                        Влажность
                    </span>

                    <span
                        id="humidity"
                        class="detail-value"
                    ></span>
                </div>

                <div class="detail">
                    <span class="detail-label">
                        Ветер
                    </span>

                    <span
                        id="wind"
                        class="detail-value"
                    ></span>
                </div>

                <div class="detail">
                    <span class="detail-label">
                        Осадки
                    </span>

                    <span
                        id="precipitation"
                        class="detail-value"
                    ></span>
                </div>
            </div>
        </section>

        <section
            id="forecast-card"
            class="card hidden"
        >
            <h2 class="forecast-title">
                Прогноз на 5 дней
            </h2>

            <div
                id="forecast-list"
                class="forecast-list"
            ></div>
        </section>
    </main>

    <script>
        const telegram = window.Telegram?.WebApp;

        if (telegram) {
            telegram.ready();
            telegram.expand();

            /*
             * Telegram может передать свои цвета темы.
             * Благодаря этому страница лучше сочетается
             * со светлой или тёмной темой приложения.
             */
            const colors = telegram.themeParams;

            if (colors.bg_color) {
                document.documentElement.style.setProperty(
                    "--background",
                    colors.bg_color
                );
            }

            if (colors.text_color) {
                document.documentElement.style.setProperty(
                    "--text",
                    colors.text_color
                );
            }

            if (colors.hint_color) {
                document.documentElement.style.setProperty(
                    "--muted",
                    colors.hint_color
                );
            }

            if (colors.button_color) {
                document.documentElement.style.setProperty(
                    "--accent",
                    colors.button_color
                );
            }
        }

        const loadingCard =
            document.getElementById("loading-card");

        const errorCard =
            document.getElementById("error-card");

        const weatherCard =
            document.getElementById("weather-card");

        const forecastCard =
            document.getElementById("forecast-card");

        const requestedCityElement =
            document.getElementById("requested-city");

        const errorText =
            document.getElementById("error-text");

        const retryButton =
            document.getElementById("retry-button");


        function getCityFromUrl() {
            const parameters =
                new URLSearchParams(window.location.search);

            const city = parameters.get("city");

            if (!city) {
                return "";
            }

            return city.trim();
        }


        function getWeatherInfo(code, isDay = true) {
            const weatherCodes = {
                0: {
                    day: "☀️",
                    night: "🌙",
                    text: "Ясно"
                },

                1: {
                    day: "🌤️",
                    night: "🌙",
                    text: "Преимущественно ясно"
                },

                2: {
                    day: "⛅",
                    night: "☁️",
                    text: "Переменная облачность"
                },

                3: {
                    day: "☁️",
                    night: "☁️",
                    text: "Пасмурно"
                },

                45: {
                    day: "🌫️",
                    night: "🌫️",
                    text: "Туман"
                },

                48: {
                    day: "🌫️",
                    night: "🌫️",
                    text: "Изморозь и туман"
                },

                51: {
                    day: "🌦️",
                    night: "🌧️",
                    text: "Лёгкая морось"
                },

                53: {
                    day: "🌦️",
                    night: "🌧️",
                    text: "Морось"
                },

                55: {
                    day: "🌧️",
                    night: "🌧️",
                    text: "Сильная морось"
                },

                56: {
                    day: "🌧️",
                    night: "🌧️",
                    text: "Ледяная морось"
                },

                57: {
                    day: "🌧️",
                    night: "🌧️",
                    text: "Сильная ледяная морось"
                },

                61: {
                    day: "🌦️",
                    night: "🌧️",
                    text: "Небольшой дождь"
                },

                63: {
                    day: "🌧️",
                    night: "🌧️",
                    text: "Дождь"
                },

                65: {
                    day: "🌧️",
                    night: "🌧️",
                    text: "Сильный дождь"
                },

                66: {
                    day: "🌧️",
                    night: "🌧️",
                    text: "Ледяной дождь"
                },

                67: {
                    day: "🌧️",
                    night: "🌧️",
                    text: "Сильный ледяной дождь"
                },

                71: {
                    day: "🌨️",
                    night: "🌨️",
                    text: "Небольшой снег"
                },

                73: {
                    day: "🌨️",
                    night: "🌨️",
                    text: "Снег"
                },

                75: {
                    day: "❄️",
                    night: "❄️",
                    text: "Сильный снег"
                },

                77: {
                    day: "🌨️",
                    night: "🌨️",
                    text: "Снежные зёрна"
                },

                80: {
                    day: "🌦️",
                    night: "🌧️",
                    text: "Небольшие ливни"
                },

                81: {
                    day: "🌧️",
                    night: "🌧️",
                    text: "Ливни"
                },

                82: {
                    day: "⛈️",
                    night: "⛈️",
                    text: "Сильные ливни"
                },

                85: {
                    day: "🌨️",
                    night: "🌨️",
                    text: "Снежные ливни"
                },

                86: {
                    day: "❄️",
                    night: "❄️",
                    text: "Сильные снежные ливни"
                },

                95: {
                    day: "⛈️",
                    night: "⛈️",
                    text: "Гроза"
                },

                96: {
                    day: "⛈️",
                    night: "⛈️",
                    text: "Гроза с градом"
                },

                99: {
                    day: "⛈️",
                    night: "⛈️",
                    text: "Сильная гроза с градом"
                }
            };

            const fallback = {
                day: "🌡️",
                night: "🌡️",
                text: "Неизвестные условия"
            };

            const weather =
                weatherCodes[code] ?? fallback;

            return {
                icon: isDay
                    ? weather.day
                    : weather.night,

                text: weather.text
            };
        }


        function showLoading() {
            loadingCard.classList.remove("hidden");
            errorCard.classList.add("hidden");
            weatherCard.classList.add("hidden");
            forecastCard.classList.add("hidden");
        }


        function showError(message) {
            loadingCard.classList.add("hidden");
            weatherCard.classList.add("hidden");
            forecastCard.classList.add("hidden");

            errorText.textContent = message;
            errorCard.classList.remove("hidden");
        }


        async function findCity(city) {
            const parameters = new URLSearchParams({
                name: city,
                count: "1",
                language: "ru",
                format: "json"
            });

            const url =
                "https://geocoding-api.open-meteo.com/v1/search"
                + `?${parameters.toString()}`;

            const response = await fetch(url);

            if (!response.ok) {
                throw new Error(
                    "Сервис поиска города временно недоступен."
                );
            }

            const data = await response.json();

            if (!data.results || data.results.length === 0) {
                throw new Error(
                    `Город «${city}» не найден. `
                    + "Проверь написание названия."
                );
            }

            return data.results[0];
        }


        async function loadWeather(latitude, longitude) {
            const parameters = new URLSearchParams({
                latitude: String(latitude),
                longitude: String(longitude),

                current: [
                    "temperature_2m",
                    "relative_humidity_2m",
                    "apparent_temperature",
                    "is_day",
                    "precipitation",
                    "weather_code",
                    "wind_speed_10m"
                ].join(","),

                daily: [
                    "weather_code",
                    "temperature_2m_max",
                    "temperature_2m_min",
                    "precipitation_probability_max"
                ].join(","),

                timezone: "auto",
                forecast_days: "5"
            });

            const url =
                "https://api.open-meteo.com/v1/forecast"
                + `?${parameters.toString()}`;

            const response = await fetch(url);

            if (!response.ok) {
                throw new Error(
                    "Сервис погоды временно недоступен."
                );
            }

            return await response.json();
        }


        function formatLocation(location) {
            const parts = [
                location.name,
                location.admin1,
                location.country
            ];

            return parts
                .filter(Boolean)
                .filter(
                    (part, index, array) =>
                        array.indexOf(part) === index
                )
                .join(", ");
        }


        function formatDate(dateString, index) {
            if (index === 0) {
                return "Сегодня";
            }

            if (index === 1) {
                return "Завтра";
            }

            const date = new Date(
                `${dateString}T12:00:00`
            );

            return new Intl.DateTimeFormat(
                "ru-RU",
                {
                    weekday: "short",
                    day: "numeric",
                    month: "short"
                }
            ).format(date);
        }


        function renderCurrentWeather(
            location,
            weather
        ) {
            const current = weather.current;

            const weatherInfo = getWeatherInfo(
                current.weather_code,
                current.is_day === 1
            );

            document.getElementById(
                "location"
            ).textContent = formatLocation(location);

            document.getElementById(
                "temperature"
            ).textContent =
                `${Math.round(current.temperature_2m)}°`;

            document.getElementById(
                "description"
            ).textContent = weatherInfo.text;

            document.getElementById(
                "weather-icon"
            ).textContent = weatherInfo.icon;

            document.getElementById(
                "feels-like"
            ).textContent =
                `${Math.round(
                    current.apparent_temperature
                )} °C`;

            document.getElementById(
                "humidity"
            ).textContent =
                `${current.relative_humidity_2m} %`;

            document.getElementById(
                "wind"
            ).textContent =
                `${Math.round(
                    current.wind_speed_10m
                )} км/ч`;

            document.getElementById(
                "precipitation"
            ).textContent =
                `${current.precipitation} мм`;
        }


        function renderForecast(weather) {
            const daily = weather.daily;

            const forecastList =
                document.getElementById("forecast-list");

            forecastList.replaceChildren();

            daily.time.forEach(
                (date, index) => {
                    const weatherInfo =
                        getWeatherInfo(
                            daily.weather_code[index],
                            true
                        );

                    const row =
                        document.createElement("div");

                    row.className = "forecast-day";

                    const day =
                        document.createElement("div");

                    day.textContent =
                        formatDate(date, index);

                    const icon =
                        document.createElement("div");

                    icon.className = "forecast-icon";
                    icon.textContent = weatherInfo.icon;
                    icon.title = weatherInfo.text;

                    const temperature =
                        document.createElement("div");

                    temperature.className =
                        "forecast-temp";

                    const maxTemperature =
                        Math.round(
                            daily
                                .temperature_2m_max[index]
                        );

                    const minTemperature =
                        Math.round(
                            daily
                                .temperature_2m_min[index]
                        );

                    const rainProbability =
                        daily
                            .precipitation_probability_max[
                                index
                            ];

                    temperature.innerHTML =
                        `<strong>${maxTemperature}°</strong> `
                        + `<span class="temp-min">`
                        + `${minTemperature}°`
                        + `</span>`
                        + `<br>`
                        + `<small>💧 `
                        + `${rainProbability ?? 0}%`
                        + `</small>`;

                    row.append(
                        day,
                        icon,
                        temperature
                    );

                    forecastList.append(row);
                }
            );
        }


        async function start() {
            const city = getCityFromUrl();

            if (!city) {
                requestedCityElement.textContent =
                    "Город не указан";

                showError(
                    "В ссылке отсутствует параметр city. "
                    + "Открой приложение командой "
                    + "/weather НазваниеГорода."
                );

                return;
            }

            requestedCityElement.textContent =
                `Ищем погоду для города: ${city}`;

            showLoading();

            try {
                const location = await findCity(city);

                requestedCityElement.textContent =
                    formatLocation(location);

                const weather = await loadWeather(
                    location.latitude,
                    location.longitude
                );

                renderCurrentWeather(
                    location,
                    weather
                );

                renderForecast(weather);

                loadingCard.classList.add("hidden");
                errorCard.classList.add("hidden");
                weatherCard.classList.remove("hidden");
                forecastCard.classList.remove("hidden");

            } catch (error) {
                console.error(error);

                showError(
                    error instanceof Error
                        ? error.message
                        : "Произошла неизвестная ошибка."
                );
            }
        }


        retryButton.addEventListener(
            "click",
            start
        );

        start();
    </script>
</body>
</html>
